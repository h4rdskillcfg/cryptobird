<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER KICKS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00f3ff;
            --pink: #ff00ff;
            --yellow: #fcee0a;
            --bg: #050505;
            --panel: rgba(20, 20, 25, 0.8);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            overflow: hidden; /* Prevent scrolling body, handle in containers */
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3 {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            margin: 0;
        }

        /* Header */
        header {
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--cyan);
            box-shadow: 0 0 10px var(--cyan);
            background: #000;
            z-index: 10;
        }

        header h1 {
            color: var(--yellow);
            text-shadow: 2px 2px 0px var(--pink);
            letter-spacing: 2px;
        }

        /* Content Area */
        #content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 80px; /* Space for nav */
        }

        .tab-section {
            display: none;
            animation: glitch-in 0.3s forwards;
        }

        .tab-section.active {
            display: block;
        }

        /* Item Cards */
        .card {
            background: var(--panel);
            border: 1px solid var(--cyan);
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
            transition: 0.2s;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 5px; height: 100%;
            background: var(--pink);
        }

        .item-name { color: var(--cyan); font-size: 1.2rem; margin-bottom: 5px; font-family: 'Orbitron', sans-serif;}
        .item-price { color: var(--yellow); font-size: 1.1rem; }
        .item-img { font-size: 3rem; text-align: center; margin: 10px 0; text-shadow: 0 0 15px var(--cyan);}
        
        button.cyber-btn {
            width: 100%;
            background: transparent;
            color: var(--cyan);
            border: 1px solid var(--cyan);
            padding: 10px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }

        button.cyber-btn:active {
            background: var(--cyan);
            color: #000;
        }

        /* Armory Shelf */
        .shelf {
            border-bottom: 4px solid var(--pink);
            box-shadow: 0 5px 15px rgba(255, 0, 255, 0.4);
            display: flex;
            gap: 15px;
            padding: 20px 10px 5px 10px;
            margin-bottom: 30px;
            overflow-x: auto;
            min-height: 100px;
        }

        .shelf-item {
            font-size: 3rem;
            filter: drop-shadow(0 0 10px var(--cyan));
        }

        /* Profile Info */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            border: 1px solid var(--pink);
            padding: 15px;
            background: rgba(255, 0, 255, 0.05);
        }

        .avatar {
            width: 50px;
            height: 50px;
            background: var(--cyan);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
        }

        /* Bottom Nav */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            background: #000;
            border-top: 2px solid var(--pink);
            z-index: 100;
        }

        .nav-btn {
            flex: 1;
            padding: 15px 0;
            text-align: center;
            color: #888;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn.active {
            color: var(--pink);
            text-shadow: 0 0 10px var(--pink);
            background: rgba(255, 0, 255, 0.1);
        }

        @keyframes glitch-in {
            0% { opacity: 0; transform: translateX(-10px); }
            50% { opacity: 1; transform: translateX(5px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>SYS.KICKS</h1>
    </header>

    <div id="content">
        <!-- Магазин -->
        <div id="shop" class="tab-section active">
            <!-- Сюда JS добавит товары -->
        </div>

        <!-- Релизы -->
        <div id="releases" class="tab-section">
            <h2 style="color: var(--cyan); margin-bottom: 15px;">>>> UPLOAD SCHEDULE</h2>
            <div id="releases-container"></div>
        </div>

        <!-- Оружейная -->
        <div id="armory" class="tab-section">
            <div class="profile-header">
                <div class="avatar" id="userAvatar">U</div>
                <div>
                    <div style="color: var(--yellow); font-family: 'Orbitron';">USER_ID: <span id="username">UNKNOWN</span></div>
                    <div style="font-size: 0.8rem; color: #888;">STATUS: PREMIUM RUNNER</div>
                </div>
            </div>

            <h3 style="color: var(--pink);">>>> COLLECTION SHELF</h3>
            <div class="shelf" id="inventory-shelf">
                <!-- Купленные модели -->
            </div>
            <p id="empty-msg" style="color: #666; text-align: center; margin-top: 20px;">[ ОРУЖЕЙНАЯ ПУСТА ]</p>
        </div>
    </div>

    <nav>
        <div class="nav-btn active" onclick="switchTab('shop')">SHOP</div>
        <div class="nav-btn" onclick="switchTab('releases')">DROPS</div>
        <div class="nav-btn" onclick="switchTab('armory')">ARMORY</div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;

        // Инициализация Telegram WebApp
        tg.ready();
        
        // Запрос полноэкранного режима
        try {
            tg.requestFullscreen();
        } catch (e) {
            console.warn("Fullscreen API не поддерживается на данном клиенте", e);
            tg.expand(); // Фолбэк для старых клиентов
        }

        // Данные пользователя
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('username').innerText = user.username || user.first_name;
            document.getElementById('userAvatar').innerText = (user.first_name || 'U').charAt(0).toUpperCase();
        }

        // Базы данных
        const shopData = [
            { id: 1, name: "V-STOMPER X", price: 15000, img: "🥾", corp: "MILITECH" },
            { id: 2, name: "NEON GLIDER", price: 12500, img: "👟", corp: "ARASAKA" },
            { id: 3, name: "SYNTH-RUN v3", price: 8900, img: "🏃‍♂️", corp: "KANG TAO" }
        ];

        const dropsData = [
            { name: "HOLO-KICK PRO", date: "ВЫХОД: 20.06.2026", img: "✨" },
            { name: "AERO-JUMP 77", date: "ВЫХОД: 04.07.2026", img: "🚀" }
        ];

        let inventory = [];

        // Переключение вкладок
        function switchTab(tabId) {
            document.querySelectorAll('.tab-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
            
            // Легкая вибрация при клике (Haptic Feedback)
            tg.HapticFeedback.impactOccurred('light');
        }

        // Рендер магазина
        function renderShop() {
            const container = document.getElementById('shop');
            container.innerHTML = '<h2 style="color: var(--yellow); margin-bottom: 15px;">>>> BLACK MARKET</h2>';
            
            shopData.forEach(item => {
                const isBought = inventory.includes(item.id);
                const btnHtml = isBought 
                    ? `<button class="cyber-btn" style="border-color: #555; color: #555;" disabled>ПРИОБРЕТЕНО</button>`
                    : `<button class="cyber-btn" onclick="buyItem(${item.id})">BUY [ ${item.price} ₿ ]</button>`;

                container.innerHTML += `
                    <div class="card">
                        <div style="font-size: 0.7rem; color: #888; text-align: right;">CORP: ${item.corp}</div>
                        <div class="item-img">${item.img}</div>
                        <div class="item-name">${item.name}</div>
                        ${btnHtml}
                    </div>
                `;
            });
        }

        // Рендер релизов
        function renderDrops() {
            const container = document.getElementById('releases-container');
            dropsData.forEach(item => {
                container.innerHTML += `
                    <div class="card" style="border-color: var(--pink);">
                        <div class="item-img" style="text-shadow: 0 0 15px var(--pink);">${item.img}</div>
                        <div class="item-name" style="color: var(--pink);">${item.name}</div>
                        <div style="color: #fff;">${item.date}</div>
                    </div>
                `;
            });
        }

        // Покупка (добавление в Оружейную)
        window.buyItem = function(id) {
            tg.HapticFeedback.notificationOccurred('success');
            inventory.push(id);
            renderShop();
            updateArmory();
            
            // Показываем нативную кнопку TG для оповещения (опционально)
            tg.MainButton.setText('КРОССОВКИ ДОБАВЛЕНЫ В ОРУЖЕЙНУЮ');
            tg.MainButton.show();
            setTimeout(() => tg.MainButton.hide(), 2000);
        }

        // Обновление Оружейной
        function updateArmory() {
            const shelf = document.getElementById('inventory-shelf');
            const msg = document.getElementById('empty-msg');
            
            if (inventory.length > 0) {
                msg.style.display = 'none';
                shelf.innerHTML = '';
                inventory.forEach(id => {
                    const item = shopData.find(i => i.id === id);
                    shelf.innerHTML += `<div class="shelf-item">${item.img}</div>`;
                });
            }
        }

        // Инициализация
        renderShop();
        renderDrops();
        
        // Устанавливаем цвета хедера под тему TG
        tg.setHeaderColor('#000000');
        tg.setBackgroundColor('#050505');
    </script>
</body>
</html>
