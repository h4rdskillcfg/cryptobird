<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER KICKS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 100%);
            color: #00ff9f;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .glitch {
            font-size: 2.5rem;
            font-weight: bold;
            text-transform: uppercase;
            position: relative;
            text-shadow: 0.05em 0 0 #ff00de, -0.03em -0.04em 0 #00ffff,
                         0.025em 0.04em 0 #ff00de;
            animation: glitch 725ms infinite;
        }

        @keyframes glitch {
            0% {
                text-shadow: 0.05em 0 0 #ff00de, -0.03em -0.04em 0 #00ffff,
                             0.025em 0.04em 0 #ff00de;
            }
            15% {
                text-shadow: 0.05em 0 0 #ff00de, -0.03em -0.04em 0 #00ffff,
                             0.025em 0.04em 0 #ff00de;
            }
            16% {
                text-shadow: -0.05em -0.025em 0 #ff00de, 0.025em 0.035em 0 #00ffff,
                             -0.05em -0.05em 0 #ff00de;
            }
            49% {
                text-shadow: -0.05em -0.025em 0 #ff00de, 0.025em 0.035em 0 #00ffff,
                             -0.05em -0.05em 0 #ff00de;
            }
            50% {
                text-shadow: 0.05em 0.035em 0 #ff00de, 0.03em 0 0 #00ffff,
                             0 -0.04em 0 #ff00de;
            }
            99% {
                text-shadow: 0.05em 0.035em 0 #ff00de, 0.03em 0 0 #00ffff,
                             0 -0.04em 0 #ff00de;
            }
            100% {
                text-shadow: -0.05em 0 0 #ff00de, -0.025em -0.04em 0 #00ffff,
                             -0.04em -0.025em 0 #ff00de;
            }
        }

        .header {
            padding: 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 2px solid #ff00de;
            box-shadow: 0 0 20px #ff00de;
        }

        .cart-icon {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ff00de, #00ffff);
            color: #000;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 20px #ff00de;
            z-index: 1000;
            transition: transform 0.3s;
        }

        .cart-icon:hover {
            transform: scale(1.1);
        }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff0000;
            color: #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .product-card {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00ff9f;
            border-radius: 10px;
            padding: 15px;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0, 255, 159, 0.3);
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #ff00de;
            box-shadow: 0 0 25px rgba(255, 0, 222, 0.5);
        }

        .product-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #ff00de, #00ffff);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            margin-bottom: 15px;
        }

        .product-name {
            color: #00ffff;
            font-size: 1.2rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .product-price {
            color: #ff00de;
            font-size: 1.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ff00de;
        }

        .product-desc {
            color: #00ff9f;
            font-size: 0.9rem;
            margin-bottom: 15px;
            opacity: 0.8;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff00de, #00ffff);
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(255, 0, 222, 0.5);
        }

        .btn:hover {
            box-shadow: 0 0 25px rgba(255, 0, 222, 0.8);
            transform: scale(1.05);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            overflow-y: auto;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a0033, #0a0a0a);
            margin: 50px auto;
            padding: 30px;
            max-width: 500px;
            border: 2px solid #ff00de;
            border-radius: 10px;
            box-shadow: 0 0 30px #ff00de;
        }

        .close {
            color: #ff00de;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #00ffff;
        }

        .cart-item {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00ff9f;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-total {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #ff00de;
            text-align: right;
            font-size: 1.5rem;
            color: #ff00de;
        }

        .remove-btn {
            background: #ff0000;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 159, 0.05),
                rgba(0, 255, 159, 0.05) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div class="scanline"></div>
    
    <div class="header">
        <h1 class="glitch">⚡ CYBER KICKS ⚡</h1>
        <p style="color: #00ffff; margin-top: 10px;">БУДУЩЕЕ НА ТВОИХ НОГАХ</p>
    </div>

    <div class="cart-icon" onclick="openCart()">
        🛒
        <span class="cart-count" id="cartCount">0</span>
    </div>

    <div class="products" id="products"></div>

    <div id="cartModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeCart()">&times;</span>
            <h2 style="color: #ff00de; margin-bottom: 20px;">КОРЗИНА</h2>
            <div id="cartItems"></div>
            <div class="cart-total">
                ИТОГО: <span id="totalPrice">0</span> ₽
            </div>
            <button class="btn" onclick="checkout()" style="margin-top: 20px;">ОФОРМИТЬ ЗАКАЗ</button>
        </div>
    </div>

    <script>
        const products = [
            {
                id: 1,
                name: 'NEON RUNNER X1',
                price: 15999,
                desc: 'Светящиеся LED вставки, сверхлегкая подошва',
                emoji: '👟'
            },
            {
                id: 2,
                name: 'CYBER BOOST 2077',
                price: 18999,
                desc: 'Голографическое покрытие, антигравитационная технология',
                emoji: '🔥'
            },
            {
                id: 3,
                name: 'MATRIX GLIDE',
                price: 21999,
                desc: 'Самошнуровка, встроенный чип NFC',
                emoji: '⚡'
            },
            {
                id: 4,
                name: 'BLADE RUNNER PRO',
                price: 24999,
                desc: 'Карбоновая подошва, неоновая подсветка 360°',
                emoji: '🌟'
            },
            {
                id: 5,
                name: 'GHOST PROTOCOL',
                price: 19999,
                desc: 'Хамелеон-материал, меняющий цвет',
                emoji: '👻'
            },
            {
                id: 6,
                name: 'QUANTUM LEAP',
                price: 27999,
                desc: 'Квантовая амортизация, Wi-Fi модуль',
                emoji: '🚀'
            }
        ];

        let cart = [];

        function renderProducts() {
            const container = document.getElementById('products');
            container.innerHTML = products.map(product => `
                <div class="product-card">
                    <div class="product-image">${product.emoji}</div>
                    <div class="product-name">${product.name}</div>
                    <div class="product-price">${product.price.toLocaleString()} ₽</div>
                    <div class="product-desc">${product.desc}</div>
                    <button class="btn" onclick="addToCart(${product.id})">ДОБАВИТЬ В КОРЗИНУ</button>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);
            
            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            
            updateCartCount();
            
            // Vibration feedback
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }
        }

        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;
        }

        function openCart() {
            document.getElementById('cartModal').style.display = 'block';
            renderCart();
        }

        function closeCart() {
            document.getElementById('cartModal').style.display = 'none';
        }

        function renderCart() {
            const container = document.getElementById('cartItems');
            
            if (cart.length === 0) {
                container.innerHTML = '<p style="color: #00ff9f; text-align: center;">Корзина пуста</p>';
                document.getElementById('totalPrice').textContent = '0';
                return;
            }
            
            container.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div>
                        <div style="color: #00ffff;">${item.name}</div>
                        <div style="color: #ff00de;">${item.price.toLocaleString()} ₽ x ${item.quantity}</div>
                    </div>
                    <button class="remove-btn" onclick="removeFromCart(${item.id})">✕</button>
                </div>
            `).join('');
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('totalPrice').textContent = total.toLocaleString();
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartCount();
            renderCart();
        }

        function checkout() {
            if (cart.length === 0) {
                alert('Корзина пуста!');
                return;
            }
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const message = `Заказ на сумму ${total.toLocaleString()} ₽\n\n` + 
                          cart.map(item => `${item.name} x ${item.quantity}`).join('\n');
            
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.sendData(JSON.stringify({
                    cart: cart,
                    total: total
                }));
            } else {
                alert(message);
            }
        }

        // Initialize Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // Render products on load
        renderProducts();
    </script>
</body>
</html>
